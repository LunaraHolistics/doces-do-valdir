<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8d98a"/>
      <stop offset="1" stop-color="#e8c574"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#c8a859" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="520" height="360" fill="url(#bg)"/>
  <rect width="520" height="360" fill="url(#dots)"/>

  <!-- balcão -->
  <rect x="40" y="248" width="440" height="14" rx="3" fill="#8a6a2b"/>
  <rect x="40" y="260" width="440" height="100" fill="#fffaf1"/>

  <!-- pote grande -->
  <g>
    <ellipse cx="140" cy="240" rx="70" ry="10" fill="#6e4f1e" opacity=".3"/>
    <rect x="80" y="140" width="120" height="108" rx="14" fill="#fffdf8" stroke="#c8a859" stroke-width="2"/>
    <rect x="80" y="140" width="120" height="24" rx="10" fill="#2f7659"/>
    <circle cx="110" cy="180" r="9" fill="#8a5a2b"/>
    <circle cx="135" cy="195" r="9" fill="#8a5a2b"/>
    <circle cx="165" cy="185" r="9" fill="#8a5a2b"/>
    <circle cx="145" cy="215" r="9" fill="#8a5a2b"/>
    <circle cx="115" cy="220" r="9" fill="#8a5a2b"/>
  </g>

  <!-- pote médio -->
  <g>
    <ellipse cx="290" cy="245" rx="55" ry="8" fill="#6e4f1e" opacity=".3"/>
    <rect x="245" y="170" width="90" height="82" rx="12" fill="#fffdf8" stroke="#c8a859" stroke-width="2"/>
    <rect x="245" y="170" width="90" height="18" rx="8" fill="#b6533d"/>
    <rect x="262" y="200" width="56" height="8" rx="2" fill="#e8c574"/>
    <rect x="262" y="214" width="56" height="8" rx="2" fill="#e8c574"/>
    <rect x="262" y="228" width="56" height="8" rx="2" fill="#e8c574"/>
  </g>

  <!-- pilha de balas/pirulitos -->
  <g>
    <ellipse cx="420" cy="250" rx="50" ry="7" fill="#6e4f1e" opacity=".3"/>
    <line x1="395" y1="150" x2="395" y2="240" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="395" cy="145" r="18" fill="#bd463b"/>
    <line x1="425" y1="170" x2="425" y2="240" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="425" cy="165" r="18" fill="#2f7659"/>
    <line x1="450" y1="185" x2="450" y2="240" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="450" cy="180" r="15" fill="#e8c574"/>
  </g>

  <!-- etiqueta "doce de leite" -->
  <g transform="rotate(-6 370 90)">
    <rect x="320" y="60" width="130" height="60" rx="8" fill="#fffaf1" stroke="#2f7659" stroke-width="2"/>
    <text x="385" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#66564e">da casa</text>
    <text x="385" y="104" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="15" fill="#235842">doce de leite</text>
  </g>

  <!-- estrela -->
  <g transform="translate(60 60)">
    <path d="M0,-22 L6,-7 L22,-6 L10,5 L13,20 L0,12 L-13,20 L-10,5 L-22,-6 L-6,-7 Z" fill="#b6533d"/>
  </g>
</svg>